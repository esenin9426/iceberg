# Каталог Iceberg для Trino: тот же REST Catalog и тот же бакет MinIO,
# что использует Spark (см. spark_notebook/spark-defaults.conf). Благодаря
# этому таблицы, созданные из Spark (`course.<ns>.<table>`), видны в Trino
# как `iceberg.<ns>.<table>`, и наоборот — это один и тот же набор данных,
# просто два разных движка поверх него.
connector.name=iceberg

iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rest-catalog:8181
iceberg.rest-catalog.warehouse=s3://warehouse

fs.s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
