version: '3.8'

services:
    minio:
        image: minio/minio:latest
        container_name: minio
        ports:
            - "9000:9000"
            - "9001:9001"
        command: server /data --console-address ":9001"
        volumes:
            - ./minio_data:/data
        networks:
            - iceberg_net

    spark_notebook:
        build:
            context: .
            dockerfile: spark_notebook/Dockerfile
        container_name: spark_notebook
        command: start-notebook.py --IdentityProvider.token=''
        environment:
            - AWS_ACCESS_KEY_ID=minioadmin
            - AWS_SECRET_ACCESS_KEY=minioadmin
            - AWS_REGION=us-east-1
        depends_on:
            - minio
        networks:
            - iceberg_net
        volumes:
            - ./app:/app
        ports:
            - "8888:8888"
            - "4040:4040"

    rest-catalog:
        image: apache/iceberg-rest-fixture:latest
        container_name: rest-catalog
        environment:
            - AWS_ACCESS_KEY_ID=minioadmin
            - AWS_SECRET_ACCESS_KEY=minioadmin
            - AWS_REGION=us-east-1
            - CATALOG_WAREHOUSE=s3://warehouse/
            - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
            - CATALOG_S3_ENDPOINT=http://minio:9000
            - CATALOG_S3_PATH__STYLE__ACCESS=true
        ports:
            - "8181:8181"
        depends_on:
            - minio
        networks:
            - iceberg_net

networks:
    iceberg_net:
        driver: bridge
